name: Build and Package Releases

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0 libportaudio2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Vocara --icon=assets/icon.png --add-data "assets:assets" main.py
          cd dist && tar -czf ../Vocara-Linux-x86_64-py${{ matrix.python-version }}.tar.gz Vocara

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocara-Linux-x86_64-py${{ matrix.python-version }}
          path: Vocara-Linux-x86_64-py${{ matrix.python-version }}.tar.gz

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Vocara --icon=assets/icon.ico --add-data "assets;assets" main.py
          Compress-Archive -Path dist\Vocara\* -DestinationPath Vocara-Windows-x64-py${{ matrix.python-version }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocara-Windows-x64-py${{ matrix.python-version }}
          path: Vocara-Windows-x64-py${{ matrix.python-version }}.zip

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
