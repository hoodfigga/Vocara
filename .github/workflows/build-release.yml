name: Build and Package Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0 libportaudio2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Vocara --icon=assets/icon.png --add-data "assets:assets" main.py
          tar -czf Vocara-Linux-x86_64.tar.gz -C dist Vocara

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocara-Linux-x86_64
          path: Vocara-Linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Vocara --icon=assets/icon.ico --add-data "assets;assets" main.py
          Compress-Archive -Path dist\Vocara\* -DestinationPath Vocara-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocara-Windows-x64
          path: Vocara-Windows-x64.zip
